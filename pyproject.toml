[project]
name = "stai100-capstone-course-suggestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mlflow>=2.16.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can `import sql_agent` / `import scraper`
# without an editable install, and collect both the top-level tests/ folder and
# the scraper package's own tests.
pythonpath = ["."]
testpaths = ["tests", "scraper"]
